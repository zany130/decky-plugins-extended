# Decky-specific Semgrep review rules for human-led plugin review.
#
# The initial five review categories were inspired by the small local baseline in
# beallio/decky-plugins-extended commit
# f98f5974d5963d7dc08568b30d1a7a728eee15a9. The rule definitions below are an
# independent implementation with broader syntax coverage and reviewer-oriented
# messages. Findings remain review signals, never automatic blocks.

rules:
  - id: decky.python.dynamic-execution
    message: Python dynamically evaluates or compiles code.
    severity: WARNING
    languages: [python]
    metadata:
      implementation: independent
      review_area: dynamic-code-execution
      confidence: HIGH
      inspired_by: beallio/decky-plugins-extended@f98f5974d5963d7dc08568b30d1a7a728eee15a9
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: compile(..., "eval", ...)
      - pattern: compile(..., "exec", ...)
      - pattern: compile(..., "single", ...)

  - id: decky.python.shell-command
    message: Python launches a subprocess through a shell.
    severity: WARNING
    languages: [python]
    metadata:
      implementation: independent
      review_area: operating-system-command
      confidence: HIGH
      inspired_by: beallio/decky-plugins-extended@f98f5974d5963d7dc08568b30d1a7a728eee15a9
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: ^(Popen|call|check_call|check_output|run)$

  - id: decky.javascript.dynamic-execution
    message: JavaScript or TypeScript dynamically evaluates code.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      implementation: independent
      review_area: dynamic-code-execution
      confidence: HIGH
      inspired_by: beallio/decky-plugins-extended@f98f5974d5963d7dc08568b30d1a7a728eee15a9
    pattern-either:
      - pattern: eval(...)
      - pattern: globalThis.eval(...)
      - pattern: window.eval(...)
      - pattern: new Function(...)
      - pattern: require("vm").runInNewContext(...)
      - pattern: require("node:vm").runInNewContext(...)
      - pattern: require("vm").runInThisContext(...)
      - pattern: require("node:vm").runInThisContext(...)

  - id: decky.javascript.child-process-exec
    message: Node.js invokes a shell-backed child-process API.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      implementation: independent
      review_area: operating-system-command
      confidence: HIGH
      inspired_by: beallio/decky-plugins-extended@f98f5974d5963d7dc08568b30d1a7a728eee15a9
    patterns:
      - pattern-either:
          - pattern: require("child_process").$EXEC(...)
          - pattern: require("node:child_process").$EXEC(...)
          - patterns:
              - pattern-inside: |
                  const $CP = require("child_process");
                  ...
              - pattern: $CP.$EXEC(...)
          - patterns:
              - pattern-inside: |
                  const $CP = require("node:child_process");
                  ...
              - pattern: $CP.$EXEC(...)
          - patterns:
              - pattern-inside: |
                  import * as $CP from "child_process";
                  ...
              - pattern: $CP.$EXEC(...)
          - patterns:
              - pattern-inside: |
                  import * as $CP from "node:child_process";
                  ...
              - pattern: $CP.$EXEC(...)
          - patterns:
              - pattern-inside: |
                  import { $EXEC } from "child_process";
                  ...
              - pattern: $EXEC(...)
          - patterns:
              - pattern-inside: |
                  import { $EXEC } from "node:child_process";
                  ...
              - pattern: $EXEC(...)
          - patterns:
              - pattern-inside: |
                  const { $EXEC } = require("child_process");
                  ...
              - pattern: $EXEC(...)
          - patterns:
              - pattern-inside: |
                  const { $EXEC } = require("node:child_process");
                  ...
              - pattern: $EXEC(...)
      - metavariable-regex:
          metavariable: $EXEC
          regex: ^(exec|execSync)$

  - id: decky.generic.private-key
    message: Shipped plugin content contains a private-key header.
    severity: ERROR
    languages: [generic]
    metadata:
      implementation: independent
      review_area: embedded-credential
      confidence: HIGH
      inspired_by: beallio/decky-plugins-extended@f98f5974d5963d7dc08568b30d1a7a728eee15a9
    pattern-regex: '-----BEGIN (?:(?:ENCRYPTED |RSA |DSA |EC |OPENSSH )?PRIVATE KEY|PGP PRIVATE KEY BLOCK)-----'
