# Plugin Security Audit Workflow
#
# Performs static security analysis on Decky Loader plugin repositories and
# their release ZIP artifacts.  Plugin code is NEVER executed.
#
# Enforcement mode is controlled by security-policy.yml:
#   enforcement.mode: report-only   (default) — findings are surfaced but do
#                                   not block merging.
#   enforcement.mode: enforce       — BLOCK exits 2, MANUAL_REVIEW exits 3.
#
# Internal audit errors (download failure, corrupt ZIP, infrastructure faults)
# always fail CI in both modes.
#
# To switch to enforcement mode after evaluating false-positive rates, update
# security-policy.yml and open a separate PR.

name: Plugin Security Audit

on:
  pull_request:
    paths:
      - additional_plugins.txt
      - audit_plugins.py
      - security-policy.yml
      - security-allowlist.yml
      - tests/**
      - .github/workflows/plugin-security-audit.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit mode: 'changed' or 'all'"
        required: false
        default: changed

# Least-privilege: read-only repository access.
# No deployment credentials or Cloudflare secrets are accessible here.
# This workflow uses pull_request (not pull_request_target) so it always
# runs against the PR branch, never with elevated merge-queue permissions.
permissions:
  contents: read

concurrency:
  group: "security-audit-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install uv
        # astral-sh/setup-uv v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: "pyproject.toml"

      - name: Install optional security scanners
        # Scanners are installed from verified package managers; no piped-shell downloads.
        # The audit degrades gracefully when scanners are unavailable.
        run: |
          # Trivy (static vulnerability scanner) – from the official apt repo.
          # See https://aquasecurity.github.io/trivy/latest/getting-started/installation/
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends trivy || echo "::warning::trivy install failed; audit will skip it"

          # ClamAV (malware signature scanner)
          sudo apt-get install -y --no-install-recommends clamav || echo "::warning::clamav install failed; audit will skip it"
          sudo freshclam --quiet || echo "::warning::freshclam update failed; continuing with existing signatures"

        timeout-minutes: 10

      - name: Determine repositories to audit
        id: repos
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "audit_mode=changed" >> "$GITHUB_OUTPUT"
            echo "base_ref=origin/${GITHUB_BASE_REF}" >> "$GITHUB_OUTPUT"
          else
            mode="${DISPATCH_MODE:-changed}"
            echo "audit_mode=${mode}" >> "$GITHUB_OUTPUT"
            echo "base_ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run security audit
        id: audit
        env:
          # GITHUB_TOKEN is provided by the runner; never printed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_MODE: ${{ steps.repos.outputs.audit_mode }}
          BASE_REF: ${{ steps.repos.outputs.base_ref }}
        run: |
          mkdir -p security-reports

          if [[ "$AUDIT_MODE" == "all" ]]; then
            uv run python audit_plugins.py \
              --all \
              --output-dir security-reports \
              --base-ref "$BASE_REF"
          else
            uv run python audit_plugins.py \
              --changed \
              --output-dir security-reports \
              --base-ref "$BASE_REF"
          fi
        timeout-minutes: 20
        continue-on-error: false

      - name: Add audit summary to job summary
        if: always()
        run: |
          if [[ -f security-reports/security-report.md ]]; then
            cat security-reports/security-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Security Audit" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ No report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit reports as artifacts
        # Only the redacted audit reports are uploaded; extracted plugin content is not.
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-audit-reports
          path: |
            security-reports/security-report.json
            security-reports/security-report.md
          retention-days: 30
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  # Run the existing unit tests to ensure audit infrastructure is intact.
  # -------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: "pyproject.toml"

      - name: Run all tests
        env:
          GITHUB_TOKEN: test-token
        run: |
          uv run python -m unittest discover -s tests -v
        timeout-minutes: 5
