# Store-owned security audit workflow.
#
# Repository selection, policy, allowlist, and report retention remain in this
# repository. The audit engine is installed from an immutable standalone commit.

name: Plugin Security Audit

env:
  DECKY_AUDITOR_REF: 06df90e77c55180f067bf5208938ddd398aa1907

on:
  pull_request:
    paths:
      - additional_plugins.txt
      - security-policy.yml
      - security-allowlist.yml
      - semgrep-rules.yml
      - semgrep-fixtures/**
      - tests/**
      - .github/actions/setup-decky-auditor/**
      - .github/workflows/plugin-security-audit.yml
      - .github/workflows/scheduled-security-audit.yml
      - .github/workflows/standalone-consumer-validation.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit mode: changed or all"
        required: false
        default: changed
        type: choice
        options:
          - changed
          - all

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout store
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned Semgrep
        run: |
          set -euo pipefail
          uv tool install --python 3.12 --with setuptools==70.3.0 semgrep==1.132.0
          SEMGREP_BIN_DIR=$(uv tool dir --bin)
          echo "$SEMGREP_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$SEMGREP_BIN_DIR:$PATH"
          semgrep --version --disable-version-check

      - name: Validate Semgrep rule fixture contracts
        run: |
          set -euo pipefail
          semgrep \
            --config semgrep-rules.yml \
            --json \
            --metrics=off \
            --disable-version-check \
            semgrep-fixtures \
            > "$RUNNER_TEMP/semgrep-rule-results.json"
          python3 - "$RUNNER_TEMP/semgrep-rule-results.json" <<'PYEOF'
          import collections, json, sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          errors = data.get("errors") or []
          if errors:
              print(f"ERROR: Semgrep rule fixtures produced errors: {errors!r}")
              raise SystemExit(1)
          counts = collections.Counter(
              result.get("check_id") for result in data.get("results") or []
          )
          expected = collections.Counter({
              "decky.python.dynamic-execution": 1,
              "decky.python.shell-command": 1,
              "decky.javascript.dynamic-execution": 2,
              "decky.javascript.child-process-exec": 1,
              "decky.generic.private-key": 1,
          })
          if counts != expected:
              print(f"ERROR: Semgrep rule fixture mismatch: expected={expected}, actual={counts}")
              raise SystemExit(1)
          print(f"Semgrep rule controls passed: {sum(counts.values())} expected matches")
          PYEOF

      - name: Run unit tests
        env:
          GITHUB_TOKEN: test-token
        run: |
          set -euo pipefail
          uv run python -m unittest discover -s tests -v
        timeout-minutes: 5

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout store
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned standalone auditor
        id: auditor
        uses: ./.github/actions/setup-decky-auditor
        with:
          auditor-ref: ${{ env.DECKY_AUDITOR_REF }}

      - name: Install security scanners
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget apt-transport-https gnupg lsb-release clamav

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends trivy || \
            echo "::warning::trivy install failed; audit policy will decide whether this is fatal"

          uv tool install --python 3.12 --with setuptools==70.3.0 semgrep==1.132.0
          SEMGREP_BIN_DIR=$(uv tool dir --bin)
          echo "$SEMGREP_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$SEMGREP_BIN_DIR:$PATH"
          semgrep --version --disable-version-check

          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version || {
            echo "::error::clamscan unavailable after install"
            exit 1
          }
          ls /var/lib/clamav/*.c?d 2>/dev/null || {
            echo "::error::No ClamAV signature databases found after freshclam"
            exit 1
          }
        timeout-minutes: 10

      - name: Determine repositories to audit
        id: repos
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
          GITHUB_BASE_REF_VALUE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "audit_mode=changed" >> "$GITHUB_OUTPUT"
            echo "base_ref=origin/${GITHUB_BASE_REF_VALUE}" >> "$GITHUB_OUTPUT"
          else
            echo "audit_mode=${DISPATCH_MODE:-changed}" >> "$GITHUB_OUTPUT"
            echo "base_ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run standalone security audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDITOR_COMMAND: ${{ steps.auditor.outputs.command }}
          AUDIT_MODE: ${{ steps.repos.outputs.audit_mode }}
          BASE_REF: ${{ steps.repos.outputs.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p security-reports

          common_args=(
            --plugins-file "$GITHUB_WORKSPACE/additional_plugins.txt"
            --policy "$GITHUB_WORKSPACE/security-policy.yml"
            --allowlist "$GITHUB_WORKSPACE/security-allowlist.yml"
            --output-dir "$GITHUB_WORKSPACE/security-reports"
          )

          if [[ "$AUDIT_MODE" == "all" ]]; then
            "$AUDITOR_COMMAND" --all "${common_args[@]}"
          else
            "$AUDITOR_COMMAND" \
              --changed \
              --base-ref "$BASE_REF" \
              "${common_args[@]}"
          fi
        timeout-minutes: 20

      - name: Add audit summary
        if: always()
        run: |
          if [[ -f security-reports/security-report.md ]]; then
            cat security-reports/security-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Security Audit" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ No report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-audit-reports
          path: |
            security-reports/security-report.json
            security-reports/security-report.md
          retention-days: 30
          if-no-files-found: warn
