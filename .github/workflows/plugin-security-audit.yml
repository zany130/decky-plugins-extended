# Store-owned security audit workflow.
#
# Repository selection, policy, allowlist, and report retention remain in this
# repository. The audit engine is installed from an immutable standalone commit.

name: Plugin Security Audit

env:
  DECKY_AUDITOR_REF: d3e3a5f20f3d20f393b42174f0e65b0c643539a3

on:
  pull_request:
    paths:
      - README.md
      - additional_plugins.txt
      - security-policy.yml
      - security-allowlist.yml
      - generate_json.py
      - check_for_updates.py
      - plugin_release_utils.py
      - pyproject.toml
      - uv.lock
      - static/**
      - tests/**
      - .github/actions/setup-decky-auditor/**
      - .github/workflows/generate.yml
      - .github/workflows/plugin-security-audit.yml
      - .github/workflows/scheduled-security-audit.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit mode: changed or all"
        required: false
        default: changed
        type: choice
        options:
          - changed
          - all

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store-tests:
    name: Store Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout store
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned standalone auditor for compatibility check
        id: auditor
        uses: ./.github/actions/setup-decky-auditor
        with:
          auditor-ref: ${{ env.DECKY_AUDITOR_REF }}

      - name: Sync frozen store environment
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev

      - name: Run store unit tests
        env:
          GITHUB_TOKEN: test-token
        run: |
          set -euo pipefail
          uv run --frozen python -m unittest discover -s tests -v
        timeout-minutes: 5

      - name: Verify generator and auditor release selection agree
        env:
          AUDITOR_COMMAND: ${{ steps.auditor.outputs.command }}
        run: |
          set -euo pipefail

          RELEASES_FILE="$RUNNER_TEMP/release-selection-fixture.json"
          cat > "$RELEASES_FILE" <<'JSON'
          [
            {
              "tag_name": "v1.9.0",
              "prerelease": false,
              "published_at": "2026-08-01T00:00:00Z",
              "assets": [
                {
                  "name": "plugin.zip",
                  "browser_download_url": "https://example.invalid/190.zip"
                }
              ]
            },
            {
              "tag_name": "v1.10.0",
              "prerelease": false,
              "published_at": "2026-07-01T00:00:00Z",
              "assets": [
                {
                  "name": "plugin.zip",
                  "browser_download_url": "https://example.invalid/1100.zip"
                }
              ]
            },
            {
              "tag_name": "v2.0.0-beta.1",
              "prerelease": true,
              "published_at": "2026-09-01T00:00:00Z",
              "assets": [
                {
                  "name": "plugin.zip",
                  "browser_download_url": "https://example.invalid/200b1.zip"
                }
              ]
            },
            {
              "tag_name": "v3.0.0",
              "prerelease": false,
              "published_at": "2026-10-01T00:00:00Z",
              "assets": [
                {"name": "a.zip"},
                {"name": "b.zip"}
              ]
            }
          ]
          JSON

          STORE_SELECTED=$(
            uv run --frozen python - "$RELEASES_FILE" <<'PY'
          import json
          import sys

          import plugin_release_utils as release_utils

          with open(sys.argv[1], encoding="utf-8") as handle:
              releases = json.load(handle)
          selected = release_utils.select_best_release(releases, allow_prerelease=False)
          asset = release_utils.get_zip_asset(selected)
          print(json.dumps(
              {
                  "tag_name": selected["tag_name"],
                  "artifact": asset["browser_download_url"],
              },
              sort_keys=True,
          ))
          PY
          )

          AUDITOR_PYTHON="$(dirname "$AUDITOR_COMMAND")/python"
          AUDITOR_SELECTED=$(
            "$AUDITOR_PYTHON" - "$RELEASES_FILE" <<'PY'
          import json
          import sys

          import audit_plugins
          import plugin_release_utils as release_utils

          with open(sys.argv[1], encoding="utf-8") as handle:
              releases = json.load(handle)
          selected = audit_plugins.find_best_release(releases)
          asset = release_utils.get_zip_asset(selected)
          print(json.dumps(
              {
                  "tag_name": selected["tag_name"],
                  "artifact": asset["browser_download_url"],
              },
              sort_keys=True,
          ))
          PY
          )

          if [[ "$STORE_SELECTED" != "$AUDITOR_SELECTED" ]]; then
            echo "::error::release-selection mismatch"
            echo "store:   $STORE_SELECTED"
            echo "auditor: $AUDITOR_SELECTED"
            exit 1
          fi

          echo "Release selection matches: $STORE_SELECTED"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout store
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned standalone auditor
        id: auditor
        uses: ./.github/actions/setup-decky-auditor
        with:
          auditor-ref: ${{ env.DECKY_AUDITOR_REF }}

      - name: Install security scanners
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget apt-transport-https gnupg lsb-release clamav

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends trivy || \
            echo "::warning::trivy install failed; audit policy will decide whether this is fatal"

          uv tool install --python 3.12 --with setuptools==70.3.0 semgrep==1.132.0
          SEMGREP_BIN_DIR=$(uv tool dir --bin)
          echo "$SEMGREP_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$SEMGREP_BIN_DIR:$PATH"
          semgrep --version --disable-version-check

          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version || {
            echo "::error::clamscan unavailable after install"
            exit 1
          }
          ls /var/lib/clamav/*.c?d 2>/dev/null || {
            echo "::error::No ClamAV signature databases found after freshclam"
            exit 1
          }
        timeout-minutes: 10

      - name: Determine repositories to audit
        id: repos
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
          GITHUB_BASE_REF_VALUE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "audit_mode=changed" >> "$GITHUB_OUTPUT"
            echo "base_ref=origin/${GITHUB_BASE_REF_VALUE}" >> "$GITHUB_OUTPUT"
          else
            echo "audit_mode=${DISPATCH_MODE:-changed}" >> "$GITHUB_OUTPUT"
            echo "base_ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run standalone security audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDITOR_COMMAND: ${{ steps.auditor.outputs.command }}
          AUDIT_MODE: ${{ steps.repos.outputs.audit_mode }}
          BASE_REF: ${{ steps.repos.outputs.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p security-reports

          common_args=(
            --plugins-file "$GITHUB_WORKSPACE/additional_plugins.txt"
            --policy "$GITHUB_WORKSPACE/security-policy.yml"
            --allowlist "$GITHUB_WORKSPACE/security-allowlist.yml"
            --output-dir "$GITHUB_WORKSPACE/security-reports"
          )

          if [[ "$AUDIT_MODE" == "all" ]]; then
            "$AUDITOR_COMMAND" --all "${common_args[@]}"
          else
            "$AUDITOR_COMMAND" \
              --changed \
              --base-ref "$BASE_REF" \
              "${common_args[@]}"
          fi
        timeout-minutes: 20

      - name: Add audit failure summary
        if: ${{ failure() }}
        run: |
          if [[ ! -f security-reports/security-report.md ]]; then
            echo "## Security Audit" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Audit failed before a report could be generated. Check the job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-audit-reports
          path: |
            security-reports/security-report.json
            security-reports/security-report.md
          retention-days: 30
          if-no-files-found: warn
