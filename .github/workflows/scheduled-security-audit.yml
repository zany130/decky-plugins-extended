# Scheduled Plugin Security Audit
#
# The store owns the repository list, policy, allowlist, schedule, cache,
# accepted baseline, and reviewer state. The audit engine is installed from an
# immutable standalone auditor commit so implementation changes cannot enter
# scheduled runs silently.

name: Scheduled Security Audit

env:
  DECKY_AUDITOR_REF: 963eac10d3c0e02d8278ed8a3709b188fe12286d

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      skip_cache:
        description: "Ignore cached reports and rescan every plugin"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scheduled-security-audit
  cancel-in-progress: false

jobs:
  scheduled-audit:
    name: Scheduled Audit (all plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout store
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate store security state
        run: |
          set -euo pipefail
          python accepted_baseline.py --validate-only security-baselines/accepted.json
          python review_queue.py validate \
            --decisions security-review/decisions.json \
            --queue security-review/queue.json

      - name: Install pinned standalone auditor
        id: auditor
        uses: ./.github/actions/setup-decky-auditor
        with:
          auditor-ref: ${{ env.DECKY_AUDITOR_REF }}

      - name: Compute audit cache key
        id: cache-key
        run: |
          set -euo pipefail
          # Accepted baseline and reviewer state are intentionally excluded.
          # The standalone auditor attaches comparisons after cache retrieval,
          # and queue construction is downstream of the serialized report.
          CONFIG_HASH=$(
            {
              printf '%s\n' "$DECKY_AUDITOR_REF"
              sha256sum \
                additional_plugins.txt \
                security-policy.yml \
                security-allowlist.yml
            } | sha256sum | cut -c1-16
          )
          echo "restore_key=audit-cache-v1-${CONFIG_HASH}" >> "$GITHUB_OUTPUT"
          echo "save_key=audit-cache-v1-${CONFIG_HASH}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Restore audit cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_cache == false }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .audit-cache
          key: ${{ steps.cache-key.outputs.save_key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.restore_key }}

      - name: Install security scanners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends trivy || echo "::warning::trivy install failed; audit policy will decide whether this is fatal"

          uv tool install --python 3.12 --with setuptools==70.3.0 semgrep==1.132.0
          SEMGREP_BIN_DIR=$(uv tool dir --bin)
          echo "$SEMGREP_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$SEMGREP_BIN_DIR:$PATH"
          semgrep --version --disable-version-check

          sudo apt-get install -y --no-install-recommends clamav || {
            echo "::error::clamav install failed"
            exit 1
          }
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version || { echo "::error::clamscan unavailable after install"; exit 1; }
          ls /var/lib/clamav/*.c?d 2>/dev/null || {
            echo "::error::No ClamAV signature databases found after freshclam"
            exit 1
          }
        timeout-minutes: 10

      - name: Run standalone audit on all configured repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDITOR_COMMAND: ${{ steps.auditor.outputs.command }}
          SKIP_AUDIT_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_cache || false }}
        run: |
          set -euo pipefail
          mkdir -p security-reports

          cache_args=(--cache-dir "$GITHUB_WORKSPACE/.audit-cache")
          if [[ "$SKIP_AUDIT_CACHE" == "true" ]]; then
            echo "Running a complete audit without restored reports."
            rm -rf .audit-cache
            cache_args+=(--skip-cache)
          fi

          "$AUDITOR_COMMAND" \
            --all \
            --plugins-file "$GITHUB_WORKSPACE/additional_plugins.txt" \
            --policy "$GITHUB_WORKSPACE/security-policy.yml" \
            --allowlist "$GITHUB_WORKSPACE/security-allowlist.yml" \
            --output-dir "$GITHUB_WORKSPACE/security-reports" \
            --baseline-report "$GITHUB_WORKSPACE/security-baselines/accepted.json" \
            "${cache_args[@]}"
        timeout-minutes: 45

      - name: Save audit cache
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .audit-cache
          key: ${{ steps.cache-key.outputs.save_key }}

      - name: Build accepted baseline candidate
        if: success()
        env:
          LIVE_CATALOG_URL: https://zany130-decky-plugins-extended.pages.dev/plugins.json
          AUDITOR_REF: ${{ env.DECKY_AUDITOR_REF }}
        run: |
          set -euo pipefail
          LIVE_CATALOG="$RUNNER_TEMP/live-plugins.json"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            "$LIVE_CATALOG_URL" \
            --output "$LIVE_CATALOG"

          python accepted_baseline.py \
            --audit-report "$GITHUB_WORKSPACE/security-reports/security-report.json" \
            --live-catalog "$LIVE_CATALOG" \
            --plugins-file "$GITHUB_WORKSPACE/additional_plugins.txt" \
            --existing "$GITHUB_WORKSPACE/security-baselines/accepted.json" \
            --output "$GITHUB_WORKSPACE/security-reports/accepted-baseline.json" \
            --auditor-ref "$AUDITOR_REF" \
            --live-catalog-url "$LIVE_CATALOG_URL"

          python accepted_baseline.py \
            --validate-only "$GITHUB_WORKSPACE/security-reports/accepted-baseline.json"

      - name: Add audit failure summary
        if: ${{ failure() }}
        run: |
          if [[ ! -f security-reports/security-report.md ]]; then
            echo "## Scheduled Security Audit" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Audit failed before a report could be generated. Check the job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-security-audit-reports
          path: |
            security-reports/security-report.json
            security-reports/security-report.md
            security-reports/accepted-baseline.json
          retention-days: 90
          if-no-files-found: warn

  build-review-queue:
    name: Build security review queue
    needs: scheduled-audit
    if: ${{ always() && needs.scheduled-audit.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout audit-start store state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download scheduled audit report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: scheduled-security-audit-reports
          path: downloaded-audit

      - name: Build review queue candidate
        env:
          SOURCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test -f downloaded-audit/security-report.json
          mkdir -p review-queue-candidate

          python review_queue.py build \
            --audit-report downloaded-audit/security-report.json \
            --baseline security-baselines/accepted.json \
            --decisions security-review/decisions.json \
            --existing-queue security-review/queue.json \
            --plugins-file additional_plugins.txt \
            --output-json review-queue-candidate/queue.json \
            --output-markdown review-queue-candidate/queue.md \
            --source-run-url "$SOURCE_RUN_URL"

          python review_queue.py validate \
            --decisions security-review/decisions.json \
            --queue review-queue-candidate/queue.json

          cat review-queue-candidate/queue.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review queue candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-review-queue-candidate
          path: |
            review-queue-candidate/queue.json
            review-queue-candidate/queue.md
          retention-days: 90
          if-no-files-found: error

  persist-accepted-baseline:
    name: Persist accepted baseline
    needs: scheduled-audit
    if: ${{ needs.scheduled-audit.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download validated audit artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: scheduled-security-audit-reports
          path: downloaded-audit

      - name: Validate candidate baseline
        run: |
          set -euo pipefail
          test -f downloaded-audit/accepted-baseline.json
          python accepted_baseline.py \
            --validate-only downloaded-audit/accepted-baseline.json

      - name: Reject stale baseline writes
        run: |
          set -euo pipefail
          AUDIT_START_BASELINE="$RUNNER_TEMP/audit-start-accepted.json"
          git show "${GITHUB_SHA}:security-baselines/accepted.json" > "$AUDIT_START_BASELINE"

          if ! cmp --silent "$AUDIT_START_BASELINE" security-baselines/accepted.json; then
            echo "::error::accepted baseline changed on main since this audit started; refusing stale write"
            exit 1
          fi

      - name: Persist changed baseline
        run: |
          set -euo pipefail
          mkdir -p security-baselines
          cp downloaded-audit/accepted-baseline.json security-baselines/accepted.json

          if git diff --quiet -- security-baselines/accepted.json; then
            echo "Accepted security baseline is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-baselines/accepted.json
          git commit -m "chore: refresh accepted security baseline"
          git push origin HEAD:main

  persist-review-queue:
    name: Persist security review queue
    needs:
      - build-review-queue
      - persist-accepted-baseline
    if: ${{ always() && needs.build-review-queue.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download validated queue candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: security-review-queue-candidate
          path: downloaded-review

      - name: Reject stale reviewer-state writes
        run: |
          set -euo pipefail
          for path in \
            security-review/decisions.json \
            security-review/queue.json \
            security-review/queue.md
          do
            start_file="$RUNNER_TEMP/$(basename "$path").audit-start"
            git show "${GITHUB_SHA}:${path}" > "$start_file"
            if ! cmp --silent "$start_file" "$path"; then
              echo "::error::$path changed on main since this audit started; refusing stale queue write"
              exit 1
            fi
          done

      - name: Validate candidate queue and rendering
        run: |
          set -euo pipefail
          test -f downloaded-review/queue.json
          test -f downloaded-review/queue.md

          python review_queue.py validate \
            --decisions security-review/decisions.json \
            --queue downloaded-review/queue.json

          python - <<'PY'
          import json
          from pathlib import Path
          import review_queue

          queue_path = Path("downloaded-review/queue.json")
          markdown_path = Path("downloaded-review/queue.md")
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          expected = review_queue.render_markdown(queue)
          actual = markdown_path.read_text(encoding="utf-8")
          if actual != expected:
              raise SystemExit("review queue Markdown does not match validated JSON")
          PY

      - name: Persist changed queue
        run: |
          set -euo pipefail
          cp downloaded-review/queue.json security-review/queue.json
          cp downloaded-review/queue.md security-review/queue.md

          if git diff --quiet -- security-review/queue.json security-review/queue.md; then
            echo "Security review queue is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-review/queue.json security-review/queue.md
          git commit -m "chore: refresh security review queue"
          git push origin HEAD:main
