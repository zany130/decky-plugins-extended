name: PR25 Refresh Bootstrap Queue

on:
  pull_request:
    paths:
      - .github/workflows/pr25-refresh-bootstrap-queue.yml

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    if: ${{ github.head_ref == 'agent/security-review-queue' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download validated real audit report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit"
          gh run download 31286922055 \
            --repo "$GITHUB_REPOSITORY" \
            --name scheduled-security-audit-reports \
            --dir "$RUNNER_TEMP/audit"
          test -f "$RUNNER_TEMP/audit/security-report.json"

      - name: Rebuild initial queue from scratch
        env:
          AUDIT_REPORT: ${{ runner.temp }}/audit/security-report.json
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/empty-queue.json" <<'JSON'
          {
            "generated_at": "",
            "item_count": 0,
            "items": [],
            "schema_version": "1",
            "source_run_url": ""
          }
          JSON

          python review_queue.py build \
            --audit-report "$AUDIT_REPORT" \
            --baseline security-baselines/accepted.json \
            --decisions security-review/decisions.json \
            --existing-queue "$RUNNER_TEMP/empty-queue.json" \
            --plugins-file additional_plugins.txt \
            --output-json security-review/queue.json \
            --output-markdown security-review/queue.md \
            --source-run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/31286922055"

          python review_queue.py validate \
            --decisions security-review/decisions.json \
            --queue security-review/queue.json

          python - <<'PY'
          import json
          from pathlib import Path
          import review_queue

          queue = json.loads(Path("security-review/queue.json").read_text(encoding="utf-8"))
          if queue["item_count"] != 6:
              raise SystemExit(f"expected six real queue items, got {queue['item_count']}")
          framegen = next(
              item for item in queue["items"]
              if item["repository"].casefold().endswith("/decky-framegen")
          )
          if framegen["scanner_failures"] != [{"name": "clamav", "status": "failed"}]:
              raise SystemExit(f"unexpected Decky-Framegen scanner failures: {framegen['scanner_failures']}")
          expected = review_queue.render_markdown(queue)
          if Path("security-review/queue.md").read_text(encoding="utf-8") != expected:
              raise SystemExit("queue Markdown does not match deterministic rendering")
          print(f"Decky-Framegen scanner failures: {framegen['scanner_failures']}")
          PY

      - name: Commit refreshed queue
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-review/queue.json security-review/queue.md
          if git diff --cached --quiet; then
            echo "::error::queue refresh produced no change"
            exit 1
          fi
          git commit -m "chore: include scanner failures in review queue"
          git push origin HEAD:${{ github.head_ref }}
