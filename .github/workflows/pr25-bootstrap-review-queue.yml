name: PR25 Bootstrap Review Queue

on:
  pull_request:
    paths:
      - .github/workflows/pr25-bootstrap-review-queue.yml

permissions:
  contents: read
  actions: read

jobs:
  bootstrap:
    if: ${{ github.head_ref == 'agent/security-review-queue' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download validated real audit report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit"
          gh run download 31286922055 \
            --repo "$GITHUB_REPOSITORY" \
            --name scheduled-security-audit-reports \
            --dir "$RUNNER_TEMP/audit"
          test -f "$RUNNER_TEMP/audit/security-report.json"

      - name: Build and validate initial queue
        env:
          AUDIT_REPORT: ${{ runner.temp }}/audit/security-report.json
        run: |
          set -euo pipefail
          python review_queue.py build \
            --audit-report "$AUDIT_REPORT" \
            --baseline security-baselines/accepted.json \
            --decisions security-review/decisions.json \
            --existing-queue security-review/queue.json \
            --plugins-file additional_plugins.txt \
            --output-json security-review/queue.json \
            --output-markdown security-review/queue.md \
            --source-run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/31286922055"

          python review_queue.py validate \
            --decisions security-review/decisions.json \
            --queue security-review/queue.json

          python - <<'PY'
          import json
          from pathlib import Path
          import review_queue

          queue_path = Path("security-review/queue.json")
          markdown_path = Path("security-review/queue.md")
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          if queue["item_count"] != 6:
              raise SystemExit(f"expected six validated real queue items, got {queue['item_count']}")
          expected = review_queue.render_markdown(queue)
          if markdown_path.read_text(encoding="utf-8") != expected:
              raise SystemExit("queue Markdown is not the deterministic JSON rendering")
          PY

      - name: Commit initial queue to PR branch
        run: |
          set -euo pipefail
          if git diff --quiet -- security-review/queue.json security-review/queue.md; then
            echo "::error::bootstrap produced no queue change"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-review/queue.json security-review/queue.md
          git commit -m "chore: bootstrap security review queue"
          git push origin HEAD:${{ github.head_ref }}
