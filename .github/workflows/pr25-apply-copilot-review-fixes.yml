name: PR25 Apply Copilot Review Fixes

on:
  pull_request:
    paths:
      - .github/workflows/pr25-apply-copilot-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/security-review-queue' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply review fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          queue_py = Path("review_queue.py")
          text = queue_py.read_text(encoding="utf-8")

          old_helper = '''def _md(value: object) -> str:
              text = _safe_text(value)
              for char in ("\\\\", "`", "*", "_", "~", "[", "]", "<", ">", "|"):
                  text = text.replace(char, f"\\\\{char}")
              return text
          '''
          new_helper = old_helper + '''\n\ndef _code(value: object) -> str:
              """Render safe inline Markdown code without leaking escape backslashes."""
              text = _safe_text(value)
              longest_run = max((len(run) for run in re.findall(r"`+", text)), default=0)
              fence = "`" * (longest_run + 1)
              if "`" in text:
                  return f"{fence} {text} {fence}"
              return f"{fence}{text}{fence}"
          '''
          if old_helper not in text:
              raise SystemExit("expected _md helper block not found")
          text = text.replace(old_helper, new_helper, 1)

          replacements = {
              'lines.append(f"Generated: `{_md(queue[\'generated_at\'])}`")': 'lines.append(f"Generated: {_code(queue[\'generated_at\'])}")',
              'candidate = f"{_md(item[\'release\'])} / `{_short_sha(item[\'artifact_sha256\'])}`"': 'candidate = f"{_md(item[\'release\'])} / {_code(_short_sha(item[\'artifact_sha256\']))}"',
              'f"{_md(item[\'baseline_release\'])} / `{_short_sha(item[\'baseline_artifact_sha256\'])}`"': 'f"{_md(item[\'baseline_release\'])} / {_code(_short_sha(item[\'baseline_artifact_sha256\']))}"',
              'f"- Repository: `{_md(item[\'repository\'])}`"': 'f"- Repository: {_code(item[\'repository\'])}"',
              'f"- Candidate: `{_md(item[\'release\'])}` — `{_md(item[\'artifact_sha256\'] or \'artifact SHA unavailable\')}`"': 'f"- Candidate: {_code(item[\'release\'])} — {_code(item[\'artifact_sha256\'] or \'artifact SHA unavailable\')}"',
              'f"- Comparison: `{_md(item[\'comparison_status\'])}`; reviewer-attention changes: {item[\'reviewer_attention_count\']}"': 'f"- Comparison: {_code(item[\'comparison_status\'])}; reviewer-attention changes: {item[\'reviewer_attention_count\']}"',
              'f"- First seen: `{_md(item[\'first_seen_at\'])}`"': 'f"- First seen: {_code(item[\'first_seen_at\'])}"',
              'f"- Accepted baseline: `{_md(item[\'baseline_release\'])}` — `{_md(item[\'baseline_artifact_sha256\'])}`"': 'f"- Accepted baseline: {_code(item[\'baseline_release\'])} — {_code(item[\'baseline_artifact_sha256\'])}"',
              'f"{_md(scanner[\'name\'])}: `{_md(scanner[\'status\'])}`"': 'f"{_md(scanner[\'name\'])}: {_code(scanner[\'status\'])}"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected render expression not found: {old}")
              text = text.replace(old, new, 1)
          queue_py.write_text(text, encoding="utf-8")

          transition = Path("review_state_transition.py")
          text = transition.read_text(encoding="utf-8")
          old = "must remain byte-for-byte present, every new decision must target an exact"
          new = "must remain record-for-record unchanged after JSON decoding, every new decision must target an exact"
          if old not in text:
              raise SystemExit("transition wording not found")
          transition.write_text(text.replace(old, new, 1), encoding="utf-8")

          readme = Path("security-review/README.md")
          text = readme.read_text(encoding="utf-8")
          old = "Pull-request CI protects this state as an append-only ledger. Existing decisions must remain byte-for-byte unchanged, every newly appended decision must target an exact artifact that was pending in the PR base queue, and the queue change must be exactly the deterministic removal produced by the decision helper."
          new = "Pull-request CI protects this state as an append-only ledger. Existing decision records must remain semantically unchanged after JSON decoding (whitespace and key-order-only formatting are not part of the ledger guarantee), every newly appended decision must target an exact artifact that was pending in the PR base queue, and the queue change must be exactly the deterministic removal produced by the decision helper."
          if old not in text:
              raise SystemExit("README wording not found")
          readme.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/scheduled-security-audit.yml")
          text = workflow.read_text(encoding="utf-8")
          old = "          path: downloaded-audit\n\n      - name: Build review queue candidate"
          new = "          path: downloaded-audit/security-reports\n\n      - name: Build review queue candidate"
          if old not in text:
              raise SystemExit("download extraction path not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "test -f downloaded-audit/security-report.json",
              "test -f downloaded-audit/security-reports/security-report.json",
              1,
          )
          text = text.replace(
              "--audit-report downloaded-audit/security-report.json",
              "--audit-report downloaded-audit/security-reports/security-report.json",
              1,
          )
          workflow.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_review_queue_review_fixes.py")
          test_path.write_text('''import json\nimport unittest\nfrom pathlib import Path\n\nimport review_queue\n\n\nclass ReviewQueueReviewFixTests(unittest.TestCase):\n    def test_inline_code_keeps_underscores_readable(self):\n        self.assertEqual(review_queue._code("baseline_not_found"), "`baseline_not_found`")\n\n    def test_inline_code_uses_longer_fence_for_embedded_backtick(self):\n        rendered = review_queue._code("value`with_tick")\n        self.assertEqual(rendered, "`` value`with_tick ``")\n\n    def test_committed_queue_renders_code_values_without_literal_escape_backslashes(self):\n        queue = json.loads(Path("security-review/queue.json").read_text(encoding="utf-8"))\n        markdown = review_queue.render_markdown(queue)\n        self.assertIn("`baseline_not_found`", markdown)\n        self.assertNotIn("`baseline\\\\_not\\\\_found`", markdown)\n        self.assertIn("`AUDIT_ERROR`" if False else "AUDIT\\\\_ERROR", markdown)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")

          # Current queue values contain no literal backticks, so updating existing
          # single-backtick code spans is a deterministic projection of the new
          # _code() renderer. Leave non-code Markdown escaping untouched.
          queue_md = Path("security-review/queue.md")
          text = queue_md.read_text(encoding="utf-8")
          inline = re.compile(r"`([^`\\n]*)`")
          def clean_code(match):
              content = re.sub(r"\\\\([\\\\`*_~\\[\\]<>|])", r"\\1", match.group(1))
              return f"`{content}`"
          queue_md.write_text(inline.sub(clean_code, text), encoding="utf-8")
          PY

      - name: Sanity-check focused fixes
        run: |
          set -euo pipefail
          python -m py_compile review_queue.py review_state_transition.py
          grep -F '`baseline_not_found`' security-review/queue.md
          ! grep -F '`baseline\_not\_found`' security-review/queue.md
          grep -F 'downloaded-audit/security-reports/security-report.json' .github/workflows/scheduled-security-audit.yml

      - name: Commit review fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            review_queue.py \
            review_state_transition.py \
            security-review/README.md \
            security-review/queue.md \
            tests/test_review_queue_review_fixes.py \
            .github/workflows/scheduled-security-audit.yml
          git commit -m "fix: address PR25 review feedback"
          git push origin HEAD:${{ github.head_ref }}
