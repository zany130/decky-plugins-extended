name: PR26 Review Queue Recovery

on:
  push:
    branches:
      - agent/recover-review-queue-network-compat

permissions:
  contents: write

jobs:
  recover:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/recover-review-queue-network-compat
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Sync frozen store environment
        run: uv sync --frozen --no-dev

      - name: Correct mixed-transition regression setup
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_review_state_transition.py")
          text = path.read_text(encoding="utf-8")
          old = '''        with self.assertRaisesRegex(ValueError, "must be separate transitions"):
            transition.validate_transition(
                rq.empty_decisions(),
                previous_queue,
                {"schema_version": "1", "decisions": [decision]},
                previous_queue,
                transition.empty_repairs(),
                {"schema_version": "1", "repairs": [repair]},
            )
'''
          new = '''        current_queue = self.current_after_decision(previous_queue, decision)
        with self.assertRaisesRegex(ValueError, "must be separate transitions"):
            transition.validate_transition(
                rq.empty_decisions(),
                previous_queue,
                {"schema_version": "1", "decisions": [decision]},
                current_queue,
                transition.empty_repairs(),
                {"schema_version": "1", "repairs": [repair]},
            )
'''
          if old not in text:
              raise SystemExit("expected mixed-transition test block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Generate exact queue repair ledger and repaired state
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import review_queue
          import review_state_transition as transition

          queue_path = Path("security-review/queue.json")
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          decisions = json.loads(Path("security-review/decisions.json").read_text(encoding="utf-8"))
          if decisions != {"schema_version": "1", "decisions": []}:
              raise SystemExit("recovery expected decision history to remain empty and untouched")
          if queue.get("item_count") != 50:
              raise SystemExit(f"recovery expected the 50-item poisoned queue, found {queue.get('item_count')}")

          false_summary = re.compile(r"^network destinations \+0/-[1-9][0-9]*$")
          def strict_poison(item):
              changed = item.get("changed_capabilities") or []
              return (
                  item.get("artifact_sha256")
                  and item.get("priority") == "high"
                  and item.get("same_artifact") is True
                  and item.get("final_classification") not in {"AUDIT_ERROR", "BLOCK"}
                  and set(item.get("reasons") or []) == {"security_delta", "same_artifact_analysis_drift"}
                  and not item.get("scanner_failures")
                  and item.get("reviewer_attention_count") == 1
                  and len(changed) == 1
                  and changed[0].get("id") == "network_communication"
                  and changed[0].get("status_change") == "unchanged"
                  and changed[0].get("reviewer_attention") is True
                  and bool(false_summary.fullmatch(str(changed[0].get("summary") or "")))
              )

          poisoned = [item for item in queue["items"] if strict_poison(item)]
          if len(poisoned) != 39:
              raise SystemExit(f"expected exactly 39 strict poison items, found {len(poisoned)}")

          target_actions = [
              {
                  "repository": "https://github.com/Rayekkk/DeckyVibranceHDR",
                  "artifact_sha256": "8bbf5601ea5b9e9865329773f05e7a9a8e8496303a6bb447a7da5a00c61407de",
                  "capability_id": "network_communication",
                  "expected_summary": "network destinations +0/-3",
              },
              {
                  "repository": "https://github.com/Rayekkk/LeGoTDP",
                  "artifact_sha256": "2bccb912292b5d6caffcce17b2009b463fd7828aede88ce0f1af51adae4042b8",
                  "capability_id": "network_communication",
                  "expected_summary": "network destinations +0/-7",
              },
          ]
          queue_index = {
              (review_queue._repo_key(item["repository"]), item.get("artifact_sha256") or ""): item
              for item in queue["items"]
          }
          for action in target_actions:
              key = (review_queue._repo_key(action["repository"]), action["artifact_sha256"])
              item = queue_index.get(key)
              if item is None:
                  raise SystemExit(f"targeted legitimate new artifact is no longer pending: {key[0]}")
              if "new_artifact" not in item.get("reasons", []):
                  raise SystemExit(f"targeted repair item is not a new artifact: {key[0]}")
              summaries = {
                  cap.get("id"): cap.get("summary")
                  for cap in item.get("changed_capabilities") or []
              }
              if summaries.get("network_communication") != action["expected_summary"]:
                  raise SystemExit(f"targeted poisoned network summary changed: {key[0]}")
              if "source_release_integrity" not in summaries:
                  raise SystemExit(f"targeted item lost its real source/release delta: {key[0]}")

          repaired_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          repair = {
              "id": "legacy-network-cache-2026-08-12",
              "kind": transition.REPAIR_KIND_LEGACY_NETWORK,
              "auditor_ref": "963eac10d3c0e02d8278ed8a3709b188fe12286d",
              "repaired_at": repaired_at,
              "reason": (
                  "Recover reviewer state poisoned when legacy cached reports exposed an empty "
                  "structured network inventory while retaining the complete extracted_domains inventory."
              ),
              "source_run_ids": [31345491546, 31447331622, 31551933847],
              "remove_items": [
                  {
                      "repository": item["repository"],
                      "artifact_sha256": item["artifact_sha256"],
                  }
                  for item in poisoned
              ],
              "remove_capabilities": target_actions,
          }
          repair["remove_items"].sort(
              key=lambda item: (review_queue._repo_key(item["repository"]), item["artifact_sha256"])
          )
          repairs = {"schema_version": "1", "repairs": [repair]}
          transition.validate_repairs(repairs)

          repaired = transition.apply_repair(queue, repair)
          counts = {priority: 0 for priority in review_queue.PRIORITY_ORDER}
          for item in repaired["items"]:
              counts[item["priority"]] += 1
          if repaired["item_count"] != 11 or counts != {"critical": 3, "high": 6, "normal": 2}:
              raise SystemExit(
                  f"unexpected repaired queue: items={repaired['item_count']} priorities={counts}"
              )

          names = {item.get("plugin_name") or item["repository"].rstrip("/").split("/")[-1] for item in repaired["items"]}
          expected_names = {
              "Muon",
              "Decky-bionic-fg",
              "Decky-Framegen",
              "DeckyClash",
              "MoonDeck",
              "Unifideck",
              "Decky Vibrance HDR",
              "LeGoTDP",
              "Decky Notifications",
              "RomM Sync",
              "Panel de Control",
          }
          if names != expected_names:
              raise SystemExit(f"unexpected repaired review workload: {sorted(names)}")

          for repository in ("Rayekkk/DeckyVibranceHDR", "Rayekkk/LeGoTDP"):
              item = next(
                  item for item in repaired["items"]
                  if repository.casefold() in item["repository"].casefold()
              )
              if [cap["id"] for cap in item["changed_capabilities"]] != ["source_release_integrity"]:
                  raise SystemExit(f"false network sub-delta survived repair: {repository}")
              if item["reviewer_attention_count"] != 1 or item["priority"] != "high":
                  raise SystemExit(f"real source/release review context was not preserved: {repository}")

          Path("security-review/repairs.json").write_text(
              json.dumps(repairs, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          queue_path.write_text(
              json.dumps(repaired, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path("security-review/queue.md").write_text(
              review_queue.render_markdown(repaired),
              encoding="utf-8",
          )
          review_queue.validate_state(decisions, repaired)
          print(f"Recovered queue: {repaired['item_count']} items; priorities={counts}")
          PY

      - name: Run reviewer-state tests and deterministic repair validation
        run: |
          set -euo pipefail
          uv run --frozen python -m unittest \
            tests.test_review_queue \
            tests.test_review_state_transition \
            -v

          uv run --frozen python review_state_transition.py \
            --validate-repairs security-review/repairs.json

          BASE_QUEUE="$RUNNER_TEMP/base-queue.json"
          BASE_DECISIONS="$RUNNER_TEMP/base-decisions.json"
          git show "${{ github.event.before }}:security-review/queue.json" > "$BASE_QUEUE"
          git show "${{ github.event.before }}:security-review/decisions.json" > "$BASE_DECISIONS"
          printf '%s\n' '{"schema_version":"1","repairs":[]}' > "$RUNNER_TEMP/base-repairs.json"

          uv run --frozen python review_state_transition.py \
            --previous-decisions "$BASE_DECISIONS" \
            --previous-queue "$BASE_QUEUE" \
            --decisions security-review/decisions.json \
            --queue security-review/queue.json \
            --previous-repairs "$RUNNER_TEMP/base-repairs.json" \
            --repairs security-review/repairs.json

      - name: Commit repaired reviewer state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_review_state_transition.py \
            security-review/repairs.json \
            security-review/queue.json \
            security-review/queue.md
          git commit -m "fix: repair poisoned security review queue"
          git push origin HEAD:agent/recover-review-queue-network-compat
