name: PR27 Wire Queue Flood Guard

on:
  push:
    branches:
      - agent/review-queue-flood-guard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/review-queue-flood-guard
          fetch-depth: 0

      - name: Wire persistence guard into queue validator
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('review_queue.py')
          text = path.read_text(encoding='utf-8')

          import_needle = "import argparse\nimport json\nimport re\n"
          import_replacement = "import argparse\nimport json\nimport os\nimport re\n"
          if text.count(import_needle) != 1:
              raise SystemExit(f'expected one import insertion point, found {text.count(import_needle)}')
          text = text.replace(import_needle, import_replacement)

          validate_needle = (
              "        validate_state(decisions, queue)\n"
              "        print(f\"Review state is valid: decisions={len(decisions['decisions'])} pending={queue['item_count']}\")\n"
              "        return 0\n"
          )
          validate_replacement = (
              "        validate_state(decisions, queue)\n"
              "        if os.environ.get(\"GITHUB_JOB\") == \"persist-review-queue\":\n"
              "            current_path = Path(\"security-review/queue.json\")\n"
              "            candidate_path = Path(args.queue)\n"
              "            if current_path.exists() and candidate_path.resolve() != current_path.resolve():\n"
              "                import review_queue_guard\n"
              "\n"
              "                try:\n"
              "                    guard_result = review_queue_guard.require_safe_persistence(\n"
              "                        _read_json(current_path), queue\n"
              "                    )\n"
              "                except ValueError as exc:\n"
              "                    print(f\"QUEUE_FLOOD_GUARD_BLOCKED: {exc}\")\n"
              "                    return 2\n"
              "                print(\n"
              "                    \"Queue persistence guard passed: \"\n"
              "                    f\"current={guard_result['current_count']} \"\n"
              "                    f\"candidate={guard_result['candidate_count']} \"\n"
              "                    f\"drift_additions={guard_result['same_artifact_drift_additions']}\"\n"
              "                )\n"
              "        print(f\"Review state is valid: decisions={len(decisions['decisions'])} pending={queue['item_count']}\")\n"
              "        return 0\n"
          )
          if text.count(validate_needle) != 1:
              raise SystemExit(f'expected one validate insertion point, found {text.count(validate_needle)}')
          path.write_text(text.replace(validate_needle, validate_replacement), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review_queue.py
          git commit -m "feat: guard automatic review queue persistence"
          git push origin HEAD:agent/review-queue-flood-guard
